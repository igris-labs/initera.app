name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: ${{ matrix.os }} desktop
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm build
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: pnpm tauri build --bundles app
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles deb,appimage

  browser:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter initera exec playwright install --with-deps chromium
      - run: pnpm test:ui
