name: Release checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'rust-toolchain.toml'
      - 'eslint.config.mjs'
      - '.oxfmtrc.json'
      - '.github/workflows/release-checks.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'rust-toolchain.toml'
      - 'eslint.config.mjs'
      - '.oxfmtrc.json'
      - '.github/workflows/release-checks.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

jobs:
  desktop:
    name: ${{ matrix.os }} desktop
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.7.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm build
      - run: pnpm --filter initera exec tauri build --no-bundle
