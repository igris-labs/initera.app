name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  bundles:
    name: ${{ matrix.os }} bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Each platform adds its entry to the same latest.json release asset.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.7.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm exec tauri
          tagName: ${{ github.ref_name }}
          releaseName: Initera ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}

  verify-updater:
    name: Verify update manifest
    needs: bundles
    runs-on: ubuntu-22.04
    steps:
      - name: Download update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$RUNNER_TEMP"
      - name: Check version and signed platform entries
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          jq -e --arg version "${RELEASE_VERSION#v}" '
            .version == $version
            and ([.platforms | keys[] | select(startswith("darwin-") and endswith("-app"))] | length > 0)
            and ([.platforms | keys[] | select(startswith("windows-") and endswith("-nsis"))] | length > 0)
            and ([.platforms | keys[] | select(startswith("linux-") and endswith("-appimage"))] | length > 0)
            and ([.platforms | keys[] | select(startswith("linux-") and endswith("-deb"))] | length > 0)
            and all(.platforms[]; (.url | length > 0) and (.signature | length > 0))
          ' "$RUNNER_TEMP/latest.json"
