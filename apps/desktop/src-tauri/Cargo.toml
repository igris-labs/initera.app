[package]
name = "initera"
version = "0.1.0"
description = "Local desktop work manager"
authors = ["Rahul Vashishtha"]
edition = "2021"
rust-version = "1.98"

[lib]
name = "initera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
api-contract-macros = { path = "api-contract-macros" }
rusqlite = { version = "0.37.0", features = ["bundled", "backup", "preupdate_hook"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
base64 = "0.22"
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-single-instance = "2.3.0"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "=2.4.0"
tauri-plugin-updater = "=2.14.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", features = ["NSNotification", "NSOperation", "NSString", "block2"] }
